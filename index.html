<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description"
        content="A minimal productivity dashboard with pomodoro timer, to-do list, daily quotes, and smart time display.">
    <title>Productivity Board</title>
    <link rel="stylesheet" href="src/style.css" />
    <link rel="preload" href="https://cdn.jsdelivr.net/npm/remixicon@4.7.0/fonts/remixicon.css" as="style"
        onload="this.rel='stylesheet'">
    <noscript>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.7.0/fonts/remixicon.css">
    </noscript>

</head>

<body>
    <main>
        <!-- ? ================== Navbar ==================== -->
        <nav>
            <h2>Dashboard</h2>
            <div class="icons" aria-label="Navigation icons">
                <button class="icon-btn" aria-label="Notifications">
                    <i class="ri-notification-3-line"></i>
                </button>

                <button class="icon-btn" aria-label="Theme settings">
                    <i class="ri-t-shirt-fill"></i>
                </button>
            </div>
        </nav>
        <!-- ? ========================== Banner ======================== -->
        <section id="banner" class="banner-now">
            <div class="banner-bg">
                <img src="src/assets/images/banner.webp" alt="banner" fetchpriority="high" width="1920" height="1080"
                    loading="eager" decoding="async" />
            </div>

            <div class="banner-overlay">
                <div class="now-left">
                    <div class="now-time"></div>

                    <div class="now-date">
                        <span class="day"></span>,
                        <span class="date"></span>
                        <span class="year"></span>
                    </div>
                </div>

                <div class="now-right">
                    <div class="weather">
                        <i class="ri-sun-line weather-icon"></i>

                        <div class="weather-info">
                            <span class="temp"></span>
                            <span class="city"></span>
                        </div>
                    </div>
                </div>
            </div>
        </section>
        <!-- ? ========================== Bento ======================== -->
        <section id="bento">
            <div class="elem timer" data-page="timer" role="button" tabindex="0">
                <img src="src/assets/images/timer.webp" alt="timer" loading="lazy" decoding="async" />
                <h2>Pomodoro Timer</h2>
            </div>
            <hr class="divider">
            <div class="support">
                <div class="elem to-do" data-page="todo" role="button" tabindex="0">
                    <img src="src/assets/images/to-do list.webp" alt="to-do" loading="lazy" decoding="async" />
                    <h2>To-Do List</h2>
                </div>
                <div class="elem qoute" data-page="quote" role="button" tabindex="0">
                    <img src="src/assets/images/qoute.webp" alt="qoute" loading="lazy" decoding="async" />
                    <h2>Quote</h2>
                </div>
            </div>
        </section>
        <!-- ? ========================== Bento Pages ====================== -->
        <section class="bento-pages to-do-page" data-page="todo" tabindex="-1" style="display: block;">
            <div class="todo-wrap">
                <div class="todo-main">
                    <h1>Todo List</h1>
                    <div class="add-task">
                        <input id="new-task-input" placeholder="+ Add New Task" />
                    </div>

                    <p class="task-list-empty" hidden>
                        No tasks yet. Add your first task
                    </p>

                    <ul class="task-list"></ul>
                </div>

                <aside class="todo-right">
                    <div class="task-empty">
                        <p>Select a task to view details</p>
                    </div>
                    <div class="task-panel">
                        <input class="task-title" id="task-title" name="task-title" placeholder="Task title" />
                        <textarea class="task-desc" name="desc" id="desc" placeholder="Description"></textarea>

                        <div class="task-meta">
                            <label>Priority <select class="task-list-select">
                                    <option>High</option>
                                    <option>Medium</option>
                                    <option>Low</option>
                                </select></label>
                            <label>Due <input type="date" class="task-due" /></label>
                        </div>

                        <div class="tags">
                            <div class="tag-list">
                                <button class="btn small">+ Add Tag</button>
                            </div>
                        </div>

                        <div class="task-actions">
                            <button class="btn delete">Delete Task</button>
                            <button class="btn primary save">Save changes</button>
                        </div>
                    </div>
                </aside>
            </div>
            <button class="back" aria-label="Close">
                <i class="ri-close-large-line"></i>
            </button>
        </section>
        <section class="bento-pages quote-page" data-page="quote" tabindex="-1">
            <div class="quote-wrap">
                <div class="quote-card">
                    <p class="quote-text"></p>
                    <p class="quote-author"></p>

                    <div class="quote-actions">
                        <button class="icon-btn" aria-label="Refresh quote">
                            <i class="ri-refresh-line"></i>
                        </button>
                        <button class="icon-btn" aria-label="Copy quote">
                            <i class="ri-file-copy-line"></i>
                        </button>
                        <button class="icon-btn" aria-label="Like quote">
                            <i></i>
                        </button>
                    </div>
                </div>
            </div>
            <button class="back" aria-label="Close">
                <i class="ri-close-large-line"></i>
            </button>
        </section>
        <section class="bento-pages timer-page" data-page="timer" tabindex="-1">
            <div class="timer-wrap">

                <!-- Mode Switch -->
                <div class="timer-modes">
                    <button class="mode active">Pomodoro</button>
                    <button class="mode">Short Break</button>
                    <button class="mode">Long Break</button>
                </div>

                <!-- Timer Display -->
                <div class="timer-display">

                    <!-- Minus -->
                    <button class="time-adjust left" aria-label="Decrease time">
                        <i class="ri-subtract-line"></i>
                    </button>

                    <!-- Clock -->
                    <div class="clock pomodoro-mode">
                        <span class="time">25:00</span>
                    </div>

                    <!-- Plus -->
                    <button class="time-adjust right" aria-label="Increase time">
                        <i class="ri-add-line"></i>
                    </button>
                </div>

                <!-- View Toggle -->
                <div class="timer-view-toggle">
                    <label>
                        <input type="checkbox" />
                        <span>Digital Clock</span>
                    </label>
                </div>

                <!-- Controls -->
                <div class="timer-controls">
                    <button class="btn">Reset</button>
                    <button class="btn primary">Start</button>
                </div>
            </div>

            <button class="back" aria-label="Close">
                <i class="ri-close-large-line"></i>
            </button>
        </section>
    </main>
    <div id="tooltip" class="tooltip" hidden></div>
    <script type="module" src="./src/scripts/app.js" defer></script>
</body>

</html>
